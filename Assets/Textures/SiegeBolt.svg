<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a1e"/>
      <stop offset="50%" stop-color="#8b6914"/>
      <stop offset="100%" stop-color="#3d2412"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="40%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cc3333"/>
      <stop offset="100%" stop-color="#661111"/>
    </linearGradient>
  </defs>

  <!-- Feathers (rear) -->
  <polygon points="0,8 20,20 0,32" fill="url(#feather)" stroke="#330000" stroke-width="0.5"/>
  <polygon points="5,5 18,20 5,35" fill="url(#feather)" stroke="#330000" stroke-width="0.5" opacity="0.7"/>
  <polygon points="0,4 -5,20 0,36" fill="#882222" stroke="#330000" stroke-width="0.5" opacity="0.4"/>

  <!-- Shaft -->
  <rect x="5" y="15" width="70" height="10" rx="2" fill="url(#shaft)" stroke="#2a1a0a" stroke-width="0.5"/>

  <!-- Metal ferrule (shaft-to-head connector) -->
  <rect x="70" y="12" width="8" height="16" rx="1" fill="#777777" stroke="#444" stroke-width="0.5"/>

  <!-- Broadhead (large arrowhead) -->
  <polygon points="75,4 78,12 95,15 78,28 75,36" fill="url(#head)" stroke="#333" stroke-width="0.8"/>
  <polygon points="78,12 120,20 78,28" fill="url(#tip)" stroke="#666" stroke-width="0.5"/>
  <line x1="85" y1="17" x2="105" y2="20" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
  <line x1="85" y1="23" x2="105" y2="20" stroke="#cccccc" stroke-width="0.6" opacity="0.2"/>

  <!-- Metal rivets on ferrule -->
  <circle cx="74" cy="20" r="1.2" fill="#999"/>
  <circle cx="74" cy="16" r="1.2" fill="#999"/>
  <circle cx="74" cy="24" r="1.2" fill="#999"/>

  <!-- Shaft binding (leather wrap) -->
  <rect x="15" y="14" width="3" height="12" fill="#4a3020" opacity="0.6"/>
  <rect x="22" y="14" width="3" height="12" fill="#4a3020" opacity="0.6"/>
  <rect x="29" y="14" width="3" height="12" fill="#4a3020" opacity="0.6"/>
  <rect x="36" y="14" width="3" height="12" fill="#4a3020" opacity="0.6"/>

  <!-- Nock -->
  <rect x="0" y="17" width="6" height="6" rx="1" fill="#332211" stroke="#1a0f00" stroke-width="0.5"/>
</svg>